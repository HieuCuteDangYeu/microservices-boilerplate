worker_processes auto;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format upstream_log '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Round-robin is Nginx's default upstream load-balancing method.
    upstream api_gateway {
        zone api_gateway 64k;
        server api-gateway:3000 resolve;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://api_gateway;
        }
    }
}
