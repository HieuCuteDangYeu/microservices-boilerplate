services:
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:latest
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    restart: always
    expose:
      - '3000'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - microservices-net

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  friend-service:
    image: ${DOCKERHUB_USERNAME}/friend-service:latest
    build:
      context: .
      dockerfile: ./apps/friend-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:latest
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-service:
    image: ${DOCKERHUB_USERNAME}/media-service:latest
    build:
      context: .
      dockerfile: ./apps/media-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    build:
      context: .
      dockerfile: ./apps/media-processing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: SHORT
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-long-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: LONG
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    build:
      context: .
      dockerfile: ./apps/reel-indexing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      # The same image serves both lanes; only the lane differs from .env.
      INDEX_WORKER_LANE: SHORT
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-long-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      # The same image serves both lanes; only the lane differs from .env.
      INDEX_WORKER_LANE: LONG
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  content-service:
    image: ${DOCKERHUB_USERNAME}/content-service:latest
    build:
      context: .
      dockerfile: ./apps/content-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    build:
      context: .
      dockerfile: ./apps/payment-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    ports:
      - '3006:3000'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  mail-service:
    image: ${DOCKERHUB_USERNAME}/mail-service:latest
    build:
      context: .
      dockerfile: ./apps/mail-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  conversation-service:
    image: ${DOCKERHUB_USERNAME}/conversation-service:latest
    build:
      context: .
      dockerfile: ./apps/conversation-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    ports:
      - '3005:3005'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  call-service:
    image: ${DOCKERHUB_USERNAME}/call-service:latest
    build:
      context: .
      dockerfile: ./apps/call-service/Dockerfile
    restart: always
    ports:
      - '3007:3007'
      - '40000-40100:40000-40100/udp'
    environment:
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  monitoring-service:
    image: ${DOCKERHUB_USERNAME}/monitoring-service:latest
    build:
      context: .
      dockerfile: ./apps/monitoring-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    expose:
      - '3016'
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  notification-service:
    image: ${DOCKERHUB_USERNAME}/notification-service:latest
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - '3015'
    volumes:
      - ./apps/notification-service/secrets/firebase-admin.json:/usr/src/app/apps/notification-service/secrets/firebase-admin.json:ro
      - ./apps/notification-service/secrets/apns-private-key.p8:/usr/src/app/apps/notification-service/secrets/apns-private-key.p8:ro
    networks:
      - microservices-net

  ai-service:
    image: ${DOCKERHUB_USERNAME}/ai-service:latest
    build:
      context: .
      dockerfile: ./apps/ai-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
    expose:
      - '5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  rabbitmq_data:
