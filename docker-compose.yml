services:
  api-gateway:
    image: ${DOCKERHUB_USERNAME}/api-gateway:latest
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
      - /opt/velora/secrets/notification-gateway.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  user-service:
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    build:
      context: .
      dockerfile: ./apps/user-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  friend-service:
    image: ${DOCKERHUB_USERNAME}/friend-service:latest
    build:
      context: .
      dockerfile: ./apps/friend-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  auth-service:
    image: ${DOCKERHUB_USERNAME}/auth-service:latest
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-service:
    image: ${DOCKERHUB_USERNAME}/media-service:latest
    build:
      context: .
      dockerfile: ./apps/media-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    build:
      context: .
      dockerfile: ./apps/media-processing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: SHORT
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  media-processing-long-service:
    image: ${DOCKERHUB_USERNAME}/media-processing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      MEDIA_WORKER_LANE: LONG
      MEDIA_WORKER_PREFETCH: ${MEDIA_WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    build:
      context: .
      dockerfile: ./apps/reel-indexing-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      INDEX_WORKER_LANE: SHORT
      INDEX_SHORT_PREFETCH: ${INDEX_SHORT_PREFETCH:-4}
      INDEX_TRANSCRIPTION_CONCURRENCY: ${INDEX_TRANSCRIPTION_CONCURRENCY:-2}
      INDEX_TRANSCRIPTION_PROVIDER: ${INDEX_TRANSCRIPTION_PROVIDER:-cloudflare-workers-ai}
      INDEX_EMBEDDING_CONCURRENCY: ${INDEX_EMBEDDING_CONCURRENCY:-4}
      INDEX_SHORT_CHUNK_TARGET_TOKENS: ${INDEX_SHORT_CHUNK_TARGET_TOKENS:-240}
      INDEX_SHORT_CHUNK_MIN_TOKENS: ${INDEX_SHORT_CHUNK_MIN_TOKENS:-100}
      INDEX_SHORT_CHUNK_MAX_TOKENS: ${INDEX_SHORT_CHUNK_MAX_TOKENS:-340}
      INDEX_SHORT_CHUNK_MAX_SECONDS: ${INDEX_SHORT_CHUNK_MAX_SECONDS:-45}
      INDEX_SHORT_CHUNK_OVERLAP_TOKENS: ${INDEX_SHORT_CHUNK_OVERLAP_TOKENS:-35}
      INDEX_DOCUMENT_MAX_TOKENS: ${INDEX_DOCUMENT_MAX_TOKENS:-340}
      INDEX_LONG_ADAPTIVE_SECTIONING_ENABLED: ${INDEX_LONG_ADAPTIVE_SECTIONING_ENABLED:-false}
      INDEX_LONG_ADAPTIVE_SECTIONING_SHADOW_MODE: ${INDEX_LONG_ADAPTIVE_SECTIONING_SHADOW_MODE:-true}
      INDEX_QUERY_PREFETCH: ${INDEX_QUERY_PREFETCH:-20}
      INDEX_HNSW_EF_SEARCH: ${INDEX_HNSW_EF_SEARCH:-100}
      INDEX_HNSW_ITERATIVE_SCAN: ${INDEX_HNSW_ITERATIVE_SCAN:-strict_order}
      INDEX_HNSW_MAX_SCAN_TUPLES: ${INDEX_HNSW_MAX_SCAN_TUPLES:-20000}
      INDEX_HNSW_SCAN_MEM_MULTIPLIER: ${INDEX_HNSW_SCAN_MEM_MULTIPLIER:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  reel-indexing-long-service:
    image: ${DOCKERHUB_USERNAME}/reel-indexing-service:latest
    restart: always
    env_file:
      - .env
    environment:
      INDEX_WORKER_LANE: LONG
      INDEX_LONG_PREFETCH: ${INDEX_LONG_PREFETCH:-1}
      INDEX_TRANSCRIPTION_CONCURRENCY: ${INDEX_TRANSCRIPTION_CONCURRENCY:-2}
      INDEX_TRANSCRIPTION_PROVIDER: ${INDEX_TRANSCRIPTION_PROVIDER:-cloudflare-workers-ai}
      INDEX_EMBEDDING_CONCURRENCY: ${INDEX_EMBEDDING_CONCURRENCY:-4}
      INDEX_SHORT_CHUNK_TARGET_TOKENS: ${INDEX_SHORT_CHUNK_TARGET_TOKENS:-240}
      INDEX_SHORT_CHUNK_MIN_TOKENS: ${INDEX_SHORT_CHUNK_MIN_TOKENS:-100}
      INDEX_SHORT_CHUNK_MAX_TOKENS: ${INDEX_SHORT_CHUNK_MAX_TOKENS:-340}
      INDEX_SHORT_CHUNK_MAX_SECONDS: ${INDEX_SHORT_CHUNK_MAX_SECONDS:-45}
      INDEX_SHORT_CHUNK_OVERLAP_TOKENS: ${INDEX_SHORT_CHUNK_OVERLAP_TOKENS:-35}
      INDEX_DOCUMENT_MAX_TOKENS: ${INDEX_DOCUMENT_MAX_TOKENS:-340}
      INDEX_LONG_SECTION_MIN_SECONDS: ${INDEX_LONG_SECTION_MIN_SECONDS:-120}
      INDEX_LONG_SECTION_TARGET_SECONDS: ${INDEX_LONG_SECTION_TARGET_SECONDS:-300}
      INDEX_LONG_SECTION_MAX_SECONDS: ${INDEX_LONG_SECTION_MAX_SECONDS:-480}
      INDEX_LONG_SECTION_CANDIDATE_PAUSE_MS: ${INDEX_LONG_SECTION_CANDIDATE_PAUSE_MS:-1500}
      INDEX_LONG_ADAPTIVE_SECTIONING_ENABLED: ${INDEX_LONG_ADAPTIVE_SECTIONING_ENABLED:-false}
      INDEX_LONG_ADAPTIVE_SECTIONING_SHADOW_MODE: ${INDEX_LONG_ADAPTIVE_SECTIONING_SHADOW_MODE:-true}
      INDEX_SECTION_SEMANTIC_WEIGHT: ${INDEX_SECTION_SEMANTIC_WEIGHT:-0.55}
      INDEX_SECTION_PAUSE_WEIGHT: ${INDEX_SECTION_PAUSE_WEIGHT:-0.20}
      INDEX_SECTION_LEXICAL_WEIGHT: ${INDEX_SECTION_LEXICAL_WEIGHT:-0.15}
      INDEX_SECTION_DURATION_WEIGHT: ${INDEX_SECTION_DURATION_WEIGHT:-0.10}
      INDEX_SECTION_BOUNDARY_THRESHOLD: ${INDEX_SECTION_BOUNDARY_THRESHOLD:-0.38}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  content-service:
    image: ${DOCKERHUB_USERNAME}/content-service:latest
    build:
      context: .
      dockerfile: ./apps/content-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  payment-service:
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    build:
      context: .
      dockerfile: ./apps/payment-service/Dockerfile
    restart: always
    ports:
      - '3006:3000'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  mail-service:
    image: ${DOCKERHUB_USERNAME}/mail-service:latest
    build:
      context: .
      dockerfile: ./apps/mail-service/Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  conversation-service:
    image: ${DOCKERHUB_USERNAME}/conversation-service:latest
    build:
      context: .
      dockerfile: ./apps/conversation-service/Dockerfile
    restart: always
    ports:
      - '3005:3005'
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  call-service:
    image: ${DOCKERHUB_USERNAME}/call-service:latest
    build:
      context: .
      dockerfile: ./apps/call-service/Dockerfile
    restart: always
    ports:
      - '3007:3007'
      - '40000-40100:40000-40100/udp'
    environment:
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  monitoring-service:
    image: ${DOCKERHUB_USERNAME}/monitoring-service:latest
    build:
      context: .
      dockerfile: ./apps/monitoring-service/Dockerfile
    restart: always
    env_file:
      - .env
    expose:
      - '3016'
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  notification-service:
    image: ${DOCKERHUB_USERNAME}/notification-service:latest
    build:
      context: .
      dockerfile: ./apps/notification-service/Dockerfile
    restart: always
    env_file:
      - .env
      - /opt/velora/secrets/notification-gateway.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    expose:
      - '3015'
    volumes:
      - ./apps/notification-service/secrets/firebase-admin.json:/usr/src/app/apps/notification-service/secrets/firebase-admin.json:ro
      - ./apps/notification-service/secrets/apns-private-key.p8:/usr/src/app/apps/notification-service/secrets/apns-private-key.p8:ro
    networks:
      - microservices-net

  ai-service:
    image: ${DOCKERHUB_USERNAME}/ai-service:latest
    build:
      context: .
      dockerfile: ./apps/ai-service/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      AI_DATABASE_URL: ${AI_DATABASE_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:5672:5672'
    expose:
      - '5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  rabbitmq_data:
