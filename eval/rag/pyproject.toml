[project]
name = "rag-eval"
version = "1.0.0"
description = "Canonical Ragas evaluation tooling for the repository RAG pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain-community>=0.3.31,<0.4",
  "openai>=2.15.0,<3",
  "pydantic>=2.12.0,<3",
  "ragas==0.4.3",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.14.0,<0.15",
]

[project.scripts]
rag-eval = "rag_eval.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = true
