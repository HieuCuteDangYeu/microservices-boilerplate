name: Deploy Microservices to DigitalOcean

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Production uses mutable :latest image tags and a single Docker/containerd
# store on one VPS. Queue the entire workflow so a newer build cannot overwrite
# :latest while an older deployment is still pulling images.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build_services_json: ${{ steps.detect.outputs.build_services_json }}
      build_services_list: ${{ steps.detect.outputs.build_services_list }}
      deploy_services_json: ${{ steps.detect.outputs.deploy_services_json }}
      deploy_services_list: ${{ steps.detect.outputs.deploy_services_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect affected services
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          all_services=(
            api-gateway
            user-service
            friend-service
            auth-service
            media-service
            payment-service
            mail-service
            conversation-service
            content-service
            media-processing-service
            reel-indexing-service
            ai-service
            call-service
            monitoring-service
            notification-service
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed_files="__BUILD_ALL__"
          else
            before_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"

            if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              changed_files="__BUILD_ALL__"
            else
              git fetch --no-tags --depth=1 origin "$before_sha"
              changed_files="$(git diff --name-only "$before_sha" "$head_sha")"
            fi
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          build_all=false
          deploy_all=false
          if printf '%s\n' "$changed_files" | grep -qx '__BUILD_ALL__'; then
            build_all=true
            deploy_all=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json|tsconfig\.build\.json|nest-cli\.json)'; then
            build_all=true
            deploy_all=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^docker-compose\.yml'; then
            deploy_all=true
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '^\.github/workflows/deploy\.yml$'; then
            deploy_all=true
          fi

          build_services=()
          deploy_services=()

          add_build_service() {
            local candidate="$1"

            for service in "${build_services[@]}"; do
              if [ "$service" = "$candidate" ]; then
                return
              fi
            done

            build_services+=("$candidate")
          }

          add_services_importing_common_file() {
            local common_file="$1"
            local import_path="${common_file#libs/common/src/}"
            local matched=false

            import_path="@common/${import_path%.ts}"
            echo "Resolving common file ${common_file} as import ${import_path}"

            for service in "${all_services[@]}"; do
              if grep -R -q -F --include='*.ts' "$import_path" "apps/${service}/src"; then
                echo "Common file ${common_file} affects ${service}"
                add_build_service "$service"
                matched=true
              fi
            done

            [ "$matched" = true ]
          }

          if [ "$build_all" != true ]; then
            while IFS= read -r common_file; do
              if [ -z "$common_file" ]; then
                continue
              fi

              if ! add_services_importing_common_file "$common_file"; then
                build_all=true
                deploy_all=true
                break
              fi
            done < <(printf '%s\n' "$changed_files" | grep -E '^libs/common/src/.*\.ts$' || true)
          fi

          shared_library_changes="$(printf '%s\n' "$changed_files" | grep -E '^libs/' | grep -Ev '^libs/common/src/.*\.ts$' || true)"
          if [ -n "$shared_library_changes" ]; then
            build_all=true
            deploy_all=true
          fi

          if [ "$build_all" = true ]; then
            build_services=("${all_services[@]}")
            deploy_services=("${all_services[@]}")
          else
            for service in "${all_services[@]}"; do
              if printf '%s\n' "$changed_files" | grep -Eq "^apps/${service}/"; then
                add_build_service "$service"
              fi
            done

            if [ "$deploy_all" = true ]; then
              deploy_services=("${all_services[@]}")
            else
              deploy_services=("${build_services[@]}")
            fi
          fi

          for service in "${deploy_services[@]}"; do
            if [ "$service" = "media-processing-service" ]; then
              deploy_services+=("media-processing-long-service")
              break
            fi
          done

          for service in "${deploy_services[@]}"; do
            if [ "$service" = "reel-indexing-service" ]; then
              deploy_services+=("reel-indexing-long-service")
              break
            fi
          done

          if [ "${#build_services[@]}" -eq 0 ]; then
            build_services_json='[]'
            build_services_list=''
          else
            build_services_json="$(printf '%s\n' "${build_services[@]}" | jq -R . | jq -cs .)"
            build_services_list="${build_services[*]}"
          fi

          if [ "${#deploy_services[@]}" -eq 0 ]; then
            deploy_services_json='[]'
            deploy_services_list=''
          else
            deploy_services_json="$(printf '%s\n' "${deploy_services[@]}" | jq -R . | jq -cs .)"
            deploy_services_list="${deploy_services[*]}"
          fi

          echo "Build services: ${build_services_list:-none}"
          echo "Deploy services: ${deploy_services_list:-none}"
          echo "build_services_json=$build_services_json" >> "$GITHUB_OUTPUT"
          echo "build_services_list=$build_services_list" >> "$GITHUB_OUTPUT"
          echo "deploy_services_json=$deploy_services_json" >> "$GITHUB_OUTPUT"
          echo "deploy_services_list=$deploy_services_list" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.build_services_json != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.build_services_json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    if: always() && (needs.detect-changes.outputs.deploy_services_json == '[]' || needs.detect-changes.outputs.build_services_json == '[]' || needs.build-and-push.result == 'success')
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        if: needs.detect-changes.outputs.deploy_services_json != '[]'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e

            DEPLOY_SHA="${{ github.sha }}"

            echo "Checking server..."
            whoami
            pwd
            docker --version
            docker compose version
            df -h

            mkdir -p /var/www/microservices
            cd /var/www/microservices

            if [ ! -d ".git" ]; then
              git clone https://github.com/HieuCuteDangYeu/microservices-boilerplate.git .
            fi

            echo "Syncing production checkout to ${DEPLOY_SHA}..."
            git status --short
            git fetch --prune origin master

            if ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              git fetch --prune origin "${DEPLOY_SHA}"
            fi

            # Production is a deployment checkout, not a development branch.
            # Reset tracked changes/local commits but intentionally preserve
            # untracked operational artifacts such as artifacts/.
            git reset --hard
            git checkout -B master "${DEPLOY_SHA}"
            git reset --hard "${DEPLOY_SHA}"

            CHECKED_OUT_SHA="$(git rev-parse HEAD)"
            if [ "${CHECKED_OUT_SHA}" != "${DEPLOY_SHA}" ]; then
              echo "Expected deployment SHA ${DEPLOY_SHA}, got ${CHECKED_OUT_SHA}"
              exit 1
            fi

            echo "Production checkout: ${CHECKED_OUT_SHA}"
            git status --short

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            echo "DOCKERHUB_USERNAME is set"
            BUILD_SERVICES="${{ needs.detect-changes.outputs.build_services_list }}"
            DEPLOY_SERVICES="${{ needs.detect-changes.outputs.deploy_services_list }}"
            echo "Build services: ${BUILD_SERVICES:-none}"
            echo "Deploy services: ${DEPLOY_SERVICES}"

            # Validate compose without printing resolved environment values.
            echo "Validating Compose config..."
            docker compose config --quiet

            PULL_SERVICES="${BUILD_SERVICES}"
            if [ -z "${PULL_SERVICES}" ]; then
              PULL_SERVICES="${DEPLOY_SERVICES}"
            fi

            if [ -n "${PULL_SERVICES}" ]; then
              echo "Pulling deploy images: ${PULL_SERVICES}"
              pull_ok=false
              for attempt in 1 2 3; do
                echo "Docker image pull attempt ${attempt}/3..."
                if docker compose pull ${PULL_SERVICES}; then
                  pull_ok=true
                  break
                fi

                if [ "$attempt" -lt 3 ]; then
                  sleep $((attempt * 5))
                fi
              done

              if [ "$pull_ok" != true ]; then
                echo "Failed to pull deploy images after 3 attempts."
                exit 1
              fi
            else
              echo "No deploy images to pull."
            fi

            echo "Starting deploy services..."
            docker compose up -d --remove-orphans ${DEPLOY_SERVICES}

            echo "Cleaning old images..."
            docker image prune -f

            echo "Deploy complete"

      - name: Skip deploy
        if: needs.detect-changes.outputs.deploy_services_json == '[]'
        run: echo "No service changes detected. Skipping deploy."
