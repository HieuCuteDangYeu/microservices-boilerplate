name: Deploy Microservices to DigitalOcean

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: deploy-master-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            api-gateway,
            user-service,
            friend-service,
            auth-service,
            media-service,
            payment-service,
            mail-service,
            conversation-service,
            content-service,
            processing-service,
            ai-service,
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest

  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            set -e

            echo "Checking server..."
            whoami
            pwd
            docker --version
            docker compose version
            df -h

            mkdir -p /var/www/microservices
            cd /var/www/microservices

            if [ ! -d ".git" ]; then
              git clone https://github.com/HieuCuteDangYeu/microservices-boilerplate.git .
            else
              git status
              git pull origin master
            fi

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            echo "DOCKERHUB_USERNAME is set"

            echo "Compose config check:"
            docker compose config

            echo "Pulling images..."
            docker compose pull

            echo "Starting services..."
            docker compose up -d --remove-orphans

            echo "Cleaning old images..."
            docker image prune -f

            echo "Deploy complete"
