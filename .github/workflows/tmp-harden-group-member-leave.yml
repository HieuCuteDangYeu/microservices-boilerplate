name: Temp Harden Group Member Leave

on:
  push:
    branches:
      - feat/group-ownership-transfer
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DEFAULT_ADMIN_ID: 11111111-1111-4111-8111-111111111111
      BOT_USER_ID: 99999999-9999-4999-8999-999999999999
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/group-ownership-transfer
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/tmp-harden-group-member-leave.cjs
      - run: pnpm exec prettier --write apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.ts apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.spec.ts apps/conversation-service/src/domain/interfaces/conversation-mutation.repository.interface.ts apps/conversation-service/src/infrastructure/repositories/prisma-conversation-chat.repository.ts
      - run: pnpm prisma:generate:conversation
      - run: pnpm test -- --runInBand apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.spec.ts apps/conversation-service/src/infrastructure/controllers/conversation.realtime.controller.spec.ts
      - run: pnpm build:conversation
      - run: pnpm build:gateway
      - run: pnpm exec eslint apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.ts apps/conversation-service/src/domain/interfaces/conversation-mutation.repository.interface.ts
      - run: git diff --check
      - name: Commit verified leave hardening patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.ts apps/conversation-service/src/application/use-cases/manage-group-conversation.use-case.spec.ts apps/conversation-service/src/domain/interfaces/conversation-mutation.repository.interface.ts apps/conversation-service/src/infrastructure/repositories/prisma-conversation-chat.repository.ts
          git commit -m 'fix(conversation): guard leave during owner transfer'
          git push origin HEAD:feat/group-ownership-transfer
