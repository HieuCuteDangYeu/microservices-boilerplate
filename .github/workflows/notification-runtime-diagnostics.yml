name: Notification Runtime Diagnostics

on:
  push:
    branches:
      - diag/notification-runtime
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect notification service startup failure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /var/www/microservices

            echo "production_sha=$(git rev-parse HEAD)"
            echo "--- notification container state ---"
            docker compose ps -a notification-service

            container_id="$(docker compose ps -aq notification-service | head -n 1)"
            if [ -n "$container_id" ]; then
              docker inspect --format 'state={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}} restart_count={{.RestartCount}} finished_at={{.State.FinishedAt}}' "$container_id"
            else
              echo "notification_container=missing"
            fi

            echo "--- required secret files presence (contents never printed) ---"
            for file in \
              apps/notification-service/secrets/firebase-admin.json \
              apps/notification-service/secrets/apns-private-key.p8; do
              if [ -s "$file" ]; then
                echo "$file=present"
              elif [ -e "$file" ]; then
                echo "$file=empty"
              else
                echo "$file=missing"
              fi
            done

            echo "--- compose-resolved notification mounts ---"
            docker compose config --format json | node -e '
              let raw="";
              process.stdin.on("data",chunk=>raw+=chunk);
              process.stdin.on("end",()=>{
                const config=JSON.parse(raw);
                const service=config.services?.["notification-service"]||{};
                const volumes=(service.volumes||[]).map((volume)=>({
                  target: typeof volume === "string" ? String(volume).split(":").slice(-1)[0] : volume.target,
                  type: typeof volume === "string" ? "bind" : volume.type
                }));
                console.log(JSON.stringify(volumes));
              });
            '

            echo "--- sanitized notification startup errors ---"
            docker compose logs --tail=400 notification-service 2>&1 \
              | grep -Ei 'error|exception|fatal|enoent|eacces|missing|invalid|prisma|redis|firebase|apns|econn|cannot|failed|p[0-9]{4}' \
              | tail -n 160 \
              || true
