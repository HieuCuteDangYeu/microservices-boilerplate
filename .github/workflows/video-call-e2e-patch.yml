name: Video Call E2E Patch

on:
  pull_request:
    branches:
      - feat/video-call-1to1
    paths:
      - scripts/apply-video-call-e2e-patch.cjs
      - scripts/apply-video-call-camera-state-patch.cjs
      - scripts/fix-video-call-e2e-paused-expectations.cjs
      - scripts/finalize-video-call-lifecycle.cjs
      - scripts/finalize-video-producer-state.cjs
      - scripts/video-call-e2e-ci-trigger.txt
      - .github/workflows/video-call-e2e-patch.yml

permissions:
  contents: write

concurrency:
  group: video-call-e2e-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-call-1to1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply guarded video patches
        id: patch
        shell: bash
        run: |
          set +e
          : > /tmp/patch.log
          node scripts/apply-video-call-e2e-patch.cjs >> /tmp/patch.log 2>&1
          e2e=$?
          node scripts/apply-video-call-camera-state-patch.cjs >> /tmp/patch.log 2>&1
          camera=$?
          node scripts/fix-video-call-e2e-paused-expectations.cjs >> /tmp/patch.log 2>&1
          expectations=$?
          node scripts/finalize-video-call-lifecycle.cjs >> /tmp/patch.log 2>&1
          lifecycle=$?
          node scripts/finalize-video-producer-state.cjs >> /tmp/patch.log 2>&1
          producer_state=$?
          code=$(( e2e || camera || expectations || lifecycle || producer_state ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/patch.log
          exit 0
      - name: Install dependencies
        if: steps.patch.outputs.code == '0'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild mediasoup
      - name: Format video-call touched files
        if: steps.patch.outputs.code == '0'
        run: |
          pnpm exec prettier --write \
            apps/call-service/src/domain/interfaces/call-media.engine.interface.ts \
            apps/call-service/src/infrastructure/engines/mediasoup-call.engine.ts \
            apps/call-service/src/infrastructure/gateways/call.gateway.ts \
            apps/call-service/src/infrastructure/repositories/redis-call-state.repository.ts \
            apps/call-service/test/e2e/call-flow.e2e.spec.ts
      - name: Verify call service
        if: steps.patch.outputs.code == '0'
        shell: bash
        run: |
          set +e
          pnpm build:call > /tmp/build.log 2>&1
          BUILD=$?
          pnpm exec jest --runInBand \
            apps/call-service/test/unit/application > /tmp/unit.log 2>&1
          UNIT=$?
          pnpm exec jest --runInBand \
            apps/call-service/test/e2e/call-flow.e2e.spec.ts \
            -t 'auto-ends unanswered video|switches VOICE to VIDEO|rejoin advertises both active audio and video|broadcasts camera off/on' > /tmp/video-e2e.log 2>&1
          VIDEO_E2E=$?
          pnpm exec jest --runInBand \
            apps/call-service/test/e2e/call-flow.e2e.spec.ts > /tmp/full-e2e.log 2>&1
          FULL_E2E=$?
          {
            echo '# Backend Video Call CI Result'
            echo
            echo "- Build exit: $BUILD"
            echo "- Unit tests exit: $UNIT"
            echo "- Targeted video E2E exit: $VIDEO_E2E"
            echo "- Full E2E exit: $FULL_E2E"
            echo
            echo '## Build'
            echo '```text'
            tail -n 120 /tmp/build.log
            echo '```'
            echo
            echo '## Unit tests'
            echo '```text'
            tail -n 160 /tmp/unit.log
            echo '```'
            echo
            echo '## Targeted video E2E'
            echo '```text'
            tail -n 220 /tmp/video-e2e.log
            echo '```'
            echo
            echo '## Full E2E'
            echo '```text'
            tail -n 280 /tmp/full-e2e.log
            echo '```'
          } > VIDEO_CALL_BACKEND_CI_RESULT.md
          exit 0
      - name: Record patch failure
        if: steps.patch.outputs.code != '0'
        shell: bash
        run: |
          {
            echo '# Backend Video Call CI Result'
            echo
            echo '- Guarded video patch failed before verification.'
            echo
            echo '```text'
            cat /tmp/patch.log
            echo '```'
          } > VIDEO_CALL_BACKEND_CI_RESULT.md
      - name: Commit generated video-call changes and result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/call-service/src/domain/interfaces/call-media.engine.interface.ts \
            apps/call-service/src/infrastructure/engines/mediasoup-call.engine.ts \
            apps/call-service/src/infrastructure/gateways/call.gateway.ts \
            apps/call-service/src/infrastructure/repositories/redis-call-state.repository.ts \
            apps/call-service/test/e2e/call-flow.e2e.spec.ts \
            VIDEO_CALL_BACKEND_CI_RESULT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          HUSKY=0 git commit -m 'fix(call): finalize 1:1 video lifecycle'
          git fetch origin feat/video-call-1to1
          git rebase origin/feat/video-call-1to1
          git push origin HEAD:feat/video-call-1to1
