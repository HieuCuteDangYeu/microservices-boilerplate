name: Video Call E2E Patch

on:
  pull_request:
    branches:
      - feat/video-call-1to1
    paths:
      - scripts/apply-video-call-e2e-patch.cjs
      - scripts/video-call-e2e-ci-trigger.txt
      - .github/workflows/video-call-e2e-patch.yml

permissions:
  contents: write

concurrency:
  group: video-call-e2e-patch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RABBITMQ_URL: amqp://127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-call-1to1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply guarded E2E patch
        id: patch
        shell: bash
        run: |
          set +e
          node scripts/apply-video-call-e2e-patch.cjs > /tmp/patch.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/patch.log
          exit 0
      - name: Install dependencies
        if: steps.patch.outputs.code == '0'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild mediasoup
      - name: Format generated E2E
        if: steps.patch.outputs.code == '0'
        run: pnpm exec prettier --write apps/call-service/test/e2e/call-flow.e2e.spec.ts
      - name: Verify call service
        if: steps.patch.outputs.code == '0'
        shell: bash
        run: |
          set +e
          pnpm build:call > /tmp/build.log 2>&1
          BUILD=$?
          pnpm exec jest --runInBand \
            apps/call-service/test/unit/application \
            apps/call-service/test/e2e/call-flow.e2e.spec.ts > /tmp/test.log 2>&1
          TEST=$?
          {
            echo '# Backend Video Call CI Result'
            echo
            echo "- Build exit: $BUILD"
            echo "- Tests exit: $TEST"
            echo
            echo '## Build'
            echo '```text'
            tail -n 160 /tmp/build.log
            echo '```'
            echo
            echo '## Tests'
            echo '```text'
            tail -n 220 /tmp/test.log
            echo '```'
          } > VIDEO_CALL_BACKEND_CI_RESULT.md
          exit 0
      - name: Record patch failure
        if: steps.patch.outputs.code != '0'
        shell: bash
        run: |
          {
            echo '# Backend Video Call CI Result'
            echo
            echo '- Guarded E2E patch failed before verification.'
            echo
            echo '```text'
            cat /tmp/patch.log
            echo '```'
          } > VIDEO_CALL_BACKEND_CI_RESULT.md
      - name: Commit generated E2E and result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/call-service/test/e2e/call-flow.e2e.spec.ts \
            VIDEO_CALL_BACKEND_CI_RESULT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          HUSKY=0 git commit -m 'test(call): cover 1:1 video gateway lifecycle'
          git fetch origin feat/video-call-1to1
          git rebase origin/feat/video-call-1to1
          git push origin HEAD:feat/video-call-1to1
